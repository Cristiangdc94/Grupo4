<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Red Edition - Interface</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <input type="checkbox" id="menu-control" class="menu-checkbox">

    <div class="background-image"></div>

    <nav class="side-menu">
        <ul class="menu-items">
            <li><a href="../index.html" class="chaos-hover">Inicio</a></li>
            <li><a href="Base.html" class="reset-link chaos-hover" id="btn-reset">Reiniciar Partida</a></li>
            
            <li class="volume-control-wrapper">
                <div class="volume-container" id="container-master">
                    <button id="btn-mute-master">
                        <i id="volume-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <div class="slider-wrapper">
                        <input type="range" id="input-master" min="0" max="1" step="0.1" value="0.5">
                    </div>
                </div>
            </li>

            <li class="volume-control-wrapper">
                <div class="volume-container music-bg" id="container-music">
                    <button id="btn-mute-music">
                        <i id="music-icon" class="fa-solid fa-music"></i>
                    </button>
                    <div class="slider-wrapper">
                        <input type="range" id="input-music" min="0" max="1" step="0.1" value="0.4">
                    </div>
                </div>
            </li>
        </ul>

        <div class="log-container">
            <h3>Historial de Decisiones</h3>
            <div id="decision-log" class="decision-log">
                <p class="empty-msg">El vacío te espera...</p>
            </div>
        </div>
    </nav>

    <div id="menu-overlay" class="menu-overlay"></div>

    <div class="main-ui">
        <label for="menu-control" class="hamburger-btn">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </label>

        <div class="info-container">
            <div class="info-box">
                <span class="label" id="choice-label"></span>
                <h2 id="choice-title"></h2>
                <hr>
                <div id="text-container">
                    <p id="choice-desc"></p>
                </div>
            </div>
        </div>

        <div class="bottom-buttons">
            <a href="#" class="game-option chaos-hover" id="opt-1">Fragmentación</a>
            <a href="#" class="game-option chaos-hover" id="opt-2">Resistencia</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
