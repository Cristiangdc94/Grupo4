<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Red Edition - Interface</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="name-modal" class="name-modal-overlay">
        <div class="name-modal-content">
            <h2 class="chaos-hover">REGISTRO DE UNIDAD</h2>
            <p>Introduce tu identificador para sincronizar con el sistema:</p>
            <input type="text" id="user-name-input" placeholder="Escribe tu nombre..." maxlength="15">
            <div class="modal-buttons">
                <button onclick="saveUserName()" class="game-option chaos-hover small-btn">ACEPTAR</button>
                <button onclick="exitToMenu()" class="game-option chaos-hover small-btn">RECHAZAR</button>
            </div>
        </div>
    </div>

    <input type="checkbox" id="menu-control" class="menu-checkbox">

    <div class="background-image"></div>

    <nav class="side-menu">
        <ul class="menu-items">
            <li class="user-display"><i class="fa-solid fa-user"></i> <span id="display-player-name">Invitado</span></li>
            <li><a href="../../index.html" class="chaos-hover">Inicio</a></li>
            <li><a href="#" class="reset-link chaos-hover" id="btn-reset" onclick="borrarPartida()">Reiniciar Partida</a></li>
            
            <li class="volume-control-wrapper">
                <div class="volume-container" id="container-master">
                    <button id="btn-mute-master">
                        <i id="volume-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <div class="slider-wrapper">
                        <input type="range" id="input-master" min="0" max="1" step="0.1" value="0.25">
                    </div>
                </div>
            </li>

            <li class="volume-control-wrapper">
                <div class="volume-container music-bg" id="container-music">
                    <button id="btn-mute-music">
                        <i id="music-icon" class="fa-solid fa-music"></i>
                    </button>
                    <div class="slider-wrapper">
                        <input type="range" id="input-music" min="0" max="1" step="0.1" value="0.25">
                    </div>
                </div>
            </li>
        </ul>

        <div class="log-container">
            <h3>Historial de Decisiones</h3>
            <div id="decision-log" class="decision-log">
                <p class="empty-msg">El vacío te espera...</p>
            </div>
        </div>
    </nav>

    <div id="menu-overlay" class="menu-overlay"></div>

    <div class="main-ui">
        <label for="menu-control" class="hamburger-btn">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </label>

        <div id="character-container" class="character-container"></div>

        <div class="info-container">
            <div class="info-box">
                <div class="dialogue-header">
                <span id="speaker-name" class="speaker-name" style="display:none;"></span>
                </div>
                <span class="label" id="choice-label"></span>
                <h2 id="choice-title"></h2>
                <hr>
                <div id="text-container">
                    <p id="choice-desc"></p>
                </div>
            </div>
        </div>

        <div class="bottom-buttons" id="bottom-buttons"></div>
    </div>

    <audio id="bg-music" src="../Music/fondo-juego.mp3.mp3" loop></audio>
    <audio id="hover-sound" src="../Sound/menu-text-sound.mp3" preload="auto"></audio>

    <script src="propierties.js"></script>
    <script src="script.js"></script>
</body>
</html>
